name: Deploy to GitHub Pages with Live Updates

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual deployment'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Shared with esp32-release.yml so the two never push to gh-pages at the same
  # time (e.g. a commit touching both src/ and esp32/ triggers both).
  group: "gh-pages-publish"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history and tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate version info
        id: version
        run: |
          # Fetch all tags to ensure they're available
          git fetch --tags --force
          
          # Debug: Show current commit and available tags
          echo "Current commit: $(git rev-parse HEAD)"
          echo "Available tags:"
          git tag -l | head -10
          echo "Tags pointing to current commit:"
          git tag --points-at HEAD
          
          # Check if current commit has a tag
          CURRENT_TAG=$(git tag --points-at HEAD | head -1)
          if [ -n "$CURRENT_TAG" ]; then
            VERSION="$CURRENT_TAG"
            echo "Using tag on current commit: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            VERSION="manual-${TIMESTAMP}-${SHORT_SHA}"
            echo "Using manual timestamp version: $VERSION"
          else
            # Plain push to main: base version from package.json + monotonic CI
            # build number → e.g. 0.0.1.143 (prettier than branch-hash, and it
            # changes every deploy so the live-update client detects it).
            BASE_VERSION=$(node -p "require('./package.json').version")
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
            echo "Using base+build version: $VERSION"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT  # ISO 8601 UTC so the app can localize it
          echo "COMMIT_HASH=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Build for GitHub Pages
        run: |
          export VITE_VERSION="${{ steps.version.outputs.VERSION }}"
          export VITE_BUILD_DATE="${{ steps.version.outputs.BUILD_DATE }}"
          export VITE_COMMIT_HASH="${{ steps.version.outputs.COMMIT_HASH }}"
          export VITE_COMMIT_MESSAGE="${{ steps.version.outputs.COMMIT_MESSAGE }}"
          # Supabase (public anon/publishable key — RLS protects data; safe to embed in the client bundle)
          export VITE_SUPABASE_URL="https://cwyypvhyrkaalagvjebp.supabase.co"
          export VITE_SUPABASE_ANON_KEY="sb_publishable_c5CSmQ-d7sWcntjziCkMMw_ZFaIOwMW"
          export NODE_ENV=production
          export GITHUB_PAGES=true
          # Temporarily modify svelte.config.js to build to docs folder
          sed -i "s/pages: 'build'/pages: 'docs'/" svelte.config.js
          sed -i "s/assets: 'build'/assets: 'docs'/" svelte.config.js
          npm run build

      - name: Build mobile live update bundle (no base path)
        run: |
          export VITE_VERSION="${{ steps.version.outputs.VERSION }}"
          export VITE_BUILD_DATE="${{ steps.version.outputs.BUILD_DATE }}"
          export VITE_COMMIT_HASH="${{ steps.version.outputs.COMMIT_HASH }}"
          export VITE_COMMIT_MESSAGE="${{ steps.version.outputs.COMMIT_MESSAGE }}"
          # Supabase (public anon/publishable key — RLS protects data; safe to embed in the client bundle)
          export VITE_SUPABASE_URL="https://cwyypvhyrkaalagvjebp.supabase.co"
          export VITE_SUPABASE_ANON_KEY="sb_publishable_c5CSmQ-d7sWcntjziCkMMw_ZFaIOwMW"
          export NODE_ENV=production
          # Ensure GITHUB_PAGES is not set for mobile build
          unset GITHUB_PAGES
          # Reset svelte.config.js to original state
          git checkout svelte.config.js
          # Build for mobile (no base path)
          npm run build
          # Create mobile bundle directory
          mkdir -p mobile-bundle
          cp -r build/* mobile-bundle/

      - name: Create live update bundle
        run: |
          # Create ZIP bundle from mobile-bundle folder (no base path)
          cd mobile-bundle
          zip -r "../live-update-${{ steps.version.outputs.VERSION }}.zip" . -x "*.zip" "version.json"
          cd ..
          
          # Move ZIP to docs folder
          mv "live-update-${{ steps.version.outputs.VERSION }}.zip" docs/
          
          # Create version manifest for live updates (use GitHub Pages URL for download)
          cat > docs/version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "downloadUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/live-update-${{ steps.version.outputs.VERSION }}.zip",
            "buildDate": "${{ steps.version.outputs.BUILD_DATE }}",
            "commitHash": "${{ steps.version.outputs.COMMIT_HASH }}",
            "commitMessage": "${{ steps.version.outputs.COMMIT_MESSAGE }}"
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          enable_jekyll: false
          # Don't delete files already on gh-pages that aren't in ./docs — the
          # ESP32 firmware registry (firmware/…) is published there by
          # esp32-release.yml and must survive a Pages deploy.
          keep_files: true