name: Deploy to GitHub Pages with Live Updates

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual deployment'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate version info
        id: version
        run: |
          # Check if we're on a git tag
          if git describe --exact-match --tags HEAD 2>/dev/null; then
            VERSION=$(git describe --exact-match --tags HEAD)
            echo "Using git tag: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manual version: $VERSION"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TIMESTAMP=$(date +%Y%m%d-%H%M%S)
            SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
            VERSION="manual-${TIMESTAMP}-${SHORT_SHA}"
            echo "Using manual timestamp version: $VERSION"
          else
            VERSION="${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)"
            echo "Using branch+hash version: $VERSION"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          echo "COMMIT_HASH=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_OUTPUT

      - name: Build for GitHub Pages
        run: |
          export VITE_VERSION="${{ steps.version.outputs.VERSION }}"
          export VITE_BUILD_DATE="${{ steps.version.outputs.BUILD_DATE }}"
          export VITE_COMMIT_HASH="${{ steps.version.outputs.COMMIT_HASH }}"
          export VITE_COMMIT_MESSAGE="${{ steps.version.outputs.COMMIT_MESSAGE }}"
          export NODE_ENV=production
          # Temporarily modify svelte.config.js to build to docs folder
          sed -i "s/pages: 'build'/pages: 'docs'/" svelte.config.js
          sed -i "s/assets: 'build'/assets: 'docs'/" svelte.config.js
          npm run build

      - name: Build mobile live update bundle (no base path)
        run: |
          export VITE_VERSION="${{ steps.version.outputs.VERSION }}"
          export VITE_BUILD_DATE="${{ steps.version.outputs.BUILD_DATE }}"
          export VITE_COMMIT_HASH="${{ steps.version.outputs.COMMIT_HASH }}"
          export VITE_COMMIT_MESSAGE="${{ steps.version.outputs.COMMIT_MESSAGE }}"
          export NODE_ENV=development
          # Reset svelte.config.js to original state
          git checkout svelte.config.js
          # Build for mobile (no base path)
          npm run build
          # Create mobile bundle directory
          mkdir -p mobile-bundle
          cp -r build/* mobile-bundle/

      - name: Create live update bundle
        run: |
          # Create ZIP bundle from mobile-bundle folder (no base path)
          cd mobile-bundle
          zip -r "../live-update-${{ steps.version.outputs.VERSION }}.zip" . -x "*.zip" "version.json"
          cd ..
          
          # Move ZIP to docs folder
          mv "live-update-${{ steps.version.outputs.VERSION }}.zip" docs/
          
          # Create version manifest for live updates (use GitHub Pages URL for download)
          cat > docs/version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "downloadUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/live-update-${{ steps.version.outputs.VERSION }}.zip",
            "buildDate": "${{ steps.version.outputs.BUILD_DATE }}",
            "commitHash": "${{ steps.version.outputs.COMMIT_HASH }}",
            "commitMessage": "${{ steps.version.outputs.COMMIT_MESSAGE }}"
          }
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          enable_jekyll: false 