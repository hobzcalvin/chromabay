name: Deploy to GitHub Pages and Live Updates

on:
  push:
    tags:
      - 'v*.*.*'  # Deploy only on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: write  # Need write access to commit to docs folder
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get build info
        run: |
          echo "VITE_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "VITE_COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_ENV
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VITE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VITE_VERSION=manual-deploy" >> $GITHUB_ENV
            echo "VERSION=manual-deploy" >> $GITHUB_ENV
          fi

      - name: Build
        run: npm run build
        env:
          VITE_COMMIT_HASH: ${{ env.VITE_COMMIT_HASH }}
          VITE_BUILD_DATE: ${{ env.VITE_BUILD_DATE }}
          VITE_COMMIT_MESSAGE: ${{ env.VITE_COMMIT_MESSAGE }}
          VITE_VERSION: ${{ env.VITE_VERSION }}

      - name: Disable Jekyll
        run: touch docs/.nojekyll

      - name: Create Live Update Bundle
        run: |
          # Create a zip bundle for live updates that can be served from GitHub Pages
          cd docs
          zip -r "live-update-${{ env.VERSION }}.zip" . -x "*.DS_Store"
          # The zip is already in the docs directory for GitHub Pages serving
          cd ..
          echo "Live update bundle created and placed in docs for GitHub Pages serving"

      - name: Create version manifest
        run: |
          # Create a simple JSON manifest for version checking
          cat > docs/version.json << EOF
          {
            "version": "${{ env.VERSION }}",
            "downloadUrl": "/blumon/live-update-${{ env.VERSION }}.zip",
            "buildDate": "${{ env.VITE_BUILD_DATE }}",
            "commitHash": "${{ env.VITE_COMMIT_HASH }}"
          }
          EOF
          echo "Version manifest created"

      - name: Upload Live Update Bundle as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-update-bundle-${{ env.VERSION }}
          path: docs/live-update-${{ env.VERSION }}.zip
          retention-days: 90

      - name: Commit and push built files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f docs/
          if ! git diff --staged --quiet; then
            git commit -m "Deploy ${{ env.VITE_VERSION || github.sha }} to docs/ folder"
            # Try to push, if it fails due to conflicts, force push
            git push origin HEAD:main || git push origin HEAD:main --force
          else
            echo "No changes to commit"
          fi 