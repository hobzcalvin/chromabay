name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'  # Deploy only on version tags like v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Get build info
        run: |
          echo "VITE_COMMIT_HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "VITE_BUILD_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV
          echo "VITE_COMMIT_MESSAGE=$(git log -1 --pretty=%B | head -1)" >> $GITHUB_ENV
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "VITE_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VITE_VERSION=manual-deploy" >> $GITHUB_ENV
          fi

      - name: Build
        run: npm run build
        env:
          VITE_COMMIT_HASH: ${{ env.VITE_COMMIT_HASH }}
          VITE_BUILD_DATE: ${{ env.VITE_BUILD_DATE }}
          VITE_COMMIT_MESSAGE: ${{ env.VITE_COMMIT_MESSAGE }}
          VITE_VERSION: ${{ env.VITE_VERSION }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 