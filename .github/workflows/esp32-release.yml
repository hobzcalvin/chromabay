name: ESP32 Firmware Release

# Builds every firmware variant, makes each one's crashes readable in Sentry, signs them,
# and publishes the result.
#
# Three jobs rather than one, because the middle step fans out. Symbolication is per-binary:
# each board and feature variant is a distinct ELF with its own debug id, and a variant
# nobody uploaded debug files for is invisible — its firmware works, its crash reports
# arrive, and only its users get raw hex addresses. So every variant is built in its own job,
# and the list of variants is read out of platformio.ini rather than written here. Adding a
# board adds it to the release.
#
#   plan     read the variants out of esp32/platformio.ini, decide the version
#   build    one job per variant: build with a build-id compiled in, stamp the ELF,
#            upload its debug files to Sentry, hand the binaries on as an artifact
#   publish  merge the factory images, PSA-sign the OTA images, push to gh-pages
#
# Secrets and variables:
#   ESP32_SIGNING_PRIVATE_KEY  (secret)   required — OTA signing, as before
#   SENTRY_AUTH_TOKEN          (secret)   optional — org auth token with scope `org:ci`.
#                                         Absent, the release still builds and publishes;
#                                         it just ships without debug files, and the job
#                                         summary says so per variant.
#   SENTRY_PROJECT             (var)      the project debug files and releases go to. There
#                                         is deliberately no SENTRY_ORG anywhere: an
#                                         organization auth token carries its own org, and
#                                         setting the variable to an empty string is what
#                                         made sentry-cli warn about it on every single run.

on:
  push:
    branches:
      - main
    paths:
      - 'esp32/**'
      - 'native/**'   # shared C++ operators are compiled into the firmware
      - '.github/workflows/esp32-release.yml'
    tags:
      - 'fwv*'
  workflow_dispatch:

permissions:
  contents: read

env:
  # sentry-micro, tracking main rather than a pinned commit — the SDK is under active
  # development and every firmware build should have the current one.
  #
  # What that costs, so it is a choice rather than an oversight: a given firmware version is
  # no longer reproducible, because rebuilding fwv0.1.107 tomorrow links a different SDK.
  # Symbolication is unaffected (debug files are matched by debug_id, which is derived per
  # build), but a breaking change upstream lands here as a failed — or worse, a silently
  # different — release. Pin all three back to one SHA before shipping to anyone who is not
  # in this room.
  CHROMABAY_SENTRY_MICRO: https://github.com/getsentry/sentry-micro.git#main

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.list.outputs.environments }}
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history: `sentry-cli releases set-commits --auto` derives the commit range
          # from it, and a shallow clone does not produce fewer commits — it produces a
          # release claiming to contain exactly one change when it contains a hundred, which
          # reads identically to the truth. The sentry-micro action refuses to build on a
          # shallow checkout for the same reason.
          fetch-depth: 0

      # Every [env:...] in esp32/platformio.ini becomes a build job. A new board therefore
      # cannot ship without debug files by someone forgetting to add it to a list here.
      - name: List firmware variants
        id: list
        uses: getsentry/sentry-micro/.github/actions/list-environments@main
        with:
          project-dir: esp32

      - name: Determine firmware version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tagged release: use the clean tag (e.g. fwv0.0.20)
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            # Auto build on main: base from firmware_version.h + monotonic CI build
            # number → e.g. fwv0.1.143 (unique + newest-first sortable).
            BASE=$(grep '#define FIRMWARE_VERSION' esp32/src/firmware_version.h | sed 's/.*"\(.*\)".*/\1/')
            VERSION="${BASE}.${{ github.run_number }}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Firmware version: ${VERSION}"

  build:
    name: Build ${{ matrix.environment }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # One broken variant should not hide the status of the other five.
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # see the plan job

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Cache the heavy bits: downloaded platforms/toolchains (~/.platformio) and the
      # incremental build dir (esp32/.pio). Keyed per variant, since each job builds one.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            esp32/.pio
          key: pio-${{ runner.os }}-${{ matrix.environment }}-${{ hashFiles('esp32/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-${{ matrix.environment }}-
            pio-${{ runner.os }}-

      - name: Stamp firmware version into source
        run: |
          # Make the built binary report exactly the version we publish to the OTA
          # registry, so the app's "device up to date?" comparison matches — and so the
          # release name below, which the firmware reports on every event, matches the
          # debug files uploaded under it.
          sed -i "s/#define FIRMWARE_VERSION \".*\"/#define FIRMWARE_VERSION \"${{ needs.plan.outputs.version }}\"/" esp32/src/firmware_version.h
          grep '#define FIRMWARE_VERSION' esp32/src/firmware_version.h

      # Builds this variant to a fixpoint (the load address it compiles in changes the image
      # it describes, so it re-measures until they agree), stamps the build-id into the ELF
      # as a non-ALLOC note, and uploads the debug files. `fwv0.1.x` is the same
      # string src/sentry_reporting.h sets as options.release, which is what ties an arriving
      # event to these files.
      - name: Build and upload debug files
        uses: getsentry/sentry-micro/.github/actions/upload-debug-files@main
        with:
          project-dir: esp32
          environments: ${{ matrix.environment }}
          # Coverage is guaranteed by the matrix, which came from platformio.ini.
          require-complete: false
          release: ${{ needs.plan.outputs.version }}
          project: ${{ vars.SENTRY_PROJECT }}
          # Build, stamp and verify unconditionally; only talk to Sentry when there is a
          # token. A repository without one still ships firmware — it just ships firmware
          # whose crashes arrive as addresses.
          upload: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # Everything the publish job needs from this variant. bootloader/partitions/boot_app0
      # are only used for the three WiFi variants (they become the merged USB image), but
      # copying them from every build keeps this step free of per-variant special cases.
      - name: Collect build output
        run: |
          set -euo pipefail
          OUT="artifact"
          mkdir -p "$OUT"
          BUILD="esp32/.pio/build/${{ matrix.environment }}"
          cp "$BUILD/firmware.bin" "$BUILD/bootloader.bin" "$BUILD/partitions.bin" "$OUT/"
          cp "$(find ~/.platformio -name boot_app0.bin | head -1)" "$OUT/"
          ls -l "$OUT"

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: fw-${{ matrix.environment }}
          path: artifact/
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Sign and publish
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and push to gh-pages
    concurrency:
      # Shared with deploy.yml so the two never push to gh-pages simultaneously. Held by
      # this job alone rather than the whole workflow, so a firmware build no longer blocks
      # an app deploy for the length of six compiles.
      group: "gh-pages-publish"
      cancel-in-progress: false
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # see the plan job

    - name: Download every variant
      uses: actions/download-artifact@v4
      with:
        path: builds
        pattern: fw-*

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        pip install cryptography esptool

    - name: Install mbedTLS for PSA crypto
      # Bounded, because this step hung for 40 minutes on a slow apt mirror and took the
      # shared gh-pages lock with it — which stalls every firmware release AND every app
      # deploy behind it, for up to the 6-hour job timeout. Failing in 5 minutes is a bad
      # build; hanging is an outage of the whole publish pipeline.
      timeout-minutes: 5
      run: |
        # The runner's pre-installed Microsoft apt repos intermittently serve invalid InRelease
        # files (NOSPLIT), failing apt-get update. We only need Ubuntu, so drop them first.
        sudo grep -lr packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
        sudo apt-get update
        sudo apt-get install -y libmbedtls-dev

    - name: Create private key file from secret
      run: |
        echo "${{ secrets.ESP32_SIGNING_PRIVATE_KEY }}" > esp32-signing-private.pem
        chmod 600 esp32-signing-private.pem

    - name: Convert private key to raw format for PSA
      run: |
        python3 convert_key_to_raw.py esp32-signing-private.pem private_key.raw

    - name: Build PSA signing tool
      run: |
        gcc -Wall -std=c99 psa_sign_firmware.c -lmbedcrypto -o psa_sign_firmware
        chmod +x psa_sign_firmware

    - name: Build merged factory images and sign (all chips)
      run: |
        set -euo pipefail
        # For each chip: merge a factory image (bootloader + partition table + boot_app0 +
        # app @ offset 0) for USB flashing, and sign the app image (firmware.bin @ 0x10000)
        # for BLE OTA. OTA and USB are always the same build.
        # Classic ESP32's bootloader lives at 0x1000; ESP32-S3/C3 at 0x0.
        # pio env | esptool --chip | bootloader offset | flash size (S3 is N8 = 8MB)
        VARIANTS=(
          "esp32dev|esp32|0x1000|4MB"
          "esp32-s3|esp32s3|0x0|8MB"
          "esp32-c3|esp32c3|0x0|4MB"
        )
        mkdir -p dist
        for row in "${VARIANTS[@]}"; do
          IFS='|' read -r ENV CHIP BOOTOFF FLASHSZ <<< "$row"
          B="builds/fw-$ENV"            # WiFi build (factory + OTA)
          BN="builds/fw-$ENV-nowifi"    # no-WiFi build (OTA-only, fits legacy slots)
          echo "▶ $CHIP: merge factory image (WiFi) + sign both OTA variants"
          # Factory USB image = the WiFi build (new partition, full features).
          esptool.py --chip "$CHIP" merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size "$FLASHSZ" \
            -o "dist/chromabay-factory-$CHIP.bin" \
            "$BOOTOFF" "$B/bootloader.bin" \
            0x8000  "$B/partitions.bin" \
            0xe000  "$B/boot_app0.bin" \
            0x10000 "$B/firmware.bin"
          # Sign + stage both OTA app images.
          ./psa_sign_firmware "$B/firmware.bin"  private_key.raw "dist/firmware-$CHIP.sig"
          cp "$B/firmware.bin"  "dist/firmware-$CHIP.bin"
          ./psa_sign_firmware "$BN/firmware.bin" private_key.raw "dist/firmware-$CHIP-nowifi.sig"
          cp "$BN/firmware.bin" "dist/firmware-$CHIP-nowifi.bin"
          ls -l "dist/chromabay-factory-$CHIP.bin" "dist/firmware-$CHIP.bin" "dist/firmware-$CHIP-nowifi.bin"
        done

    - name: Create release
      if: startsWith(github.ref, 'refs/tags/')  # GitHub Releases only for real fwv* tags, not every main build
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/firmware-esp32.bin
          dist/firmware-esp32.sig
          dist/firmware-esp32s3.bin
          dist/firmware-esp32s3.sig
          dist/firmware-esp32c3.bin
          dist/firmware-esp32c3.sig
          dist/chromabay-factory-esp32.bin
          dist/chromabay-factory-esp32s3.bin
          dist/chromabay-factory-esp32c3.bin
        body: |
          ## 🔵 ESP32 Firmware Release ${{ needs.plan.outputs.version }}

          ### 📦 Files (one set per chip — esp32 / esp32s3 / esp32c3):
          - **`firmware-<chip>.bin`** - app image (BLE OTA)
          - **`firmware-<chip>.sig`** - ECDSA P-256 signature for secure OTA updates
          - **`chromabay-factory-<chip>.bin`** - full merged image for USB flashing

          ### 🔐 Security Features:
          - ✅ Firmware is cryptographically signed with **PSA Crypto ECDSA P-256**
          - ✅ Signature verification enforced on device during OTA using **PSA Crypto**
          - ✅ **Complete PSA compatibility** between signing and verification
          - ✅ Tamper-proof updates prevent malicious firmware installation

          ### 📋 Installation:
          **Initial Upload (USB):**
          ```bash
          # Download firmware.bin and flash via USB
          esptool.py --port /dev/ttyUSB0 write_flash 0x10000 firmware.bin
          ```

          **OTA Update (BLE):**
          1. Connect to device via BLE (Service UUID: `a0be83e4-8dc9-47f0-ab40-b19721d20ed1`)
          2. Send signature to characteristic `a0be83eb-8dc9-47f0-ab40-b19721d20ed1`
          3. Send firmware data to characteristic `a0be83e9-8dc9-47f0-ab40-b19721d20ed1`
          4. Send "END_OTA" to characteristic `a0be83e8-8dc9-47f0-ab40-b19721d20ed1`
          5. Device verifies signature and reboots with new firmware

          ### 🛠 Technical Details:
          - **Targets:** ESP32 (classic), ESP32-S3, ESP32-C3 — 4MB partition layout
          - **Framework:** Arduino with PlatformIO
          - **Partition Scheme:** Dual OTA (app0/app1) with LittleFS
          - **BLE Stack:** NimBLE for efficient memory usage
          - **LED Support:** WS2812B via NeoPixelBus + FastLED
          - **Crypto:** PSA Crypto API for signing and verification
          - **Crash reporting:** Sentry, via sentry-micro — debug files uploaded per variant

        draft: false
        prerelease: false

    - name: Update firmware registry on GitHub Pages
      run: |
        # Install jq for JSON manipulation (drop the flaky Microsoft repos first — see above)
        sudo grep -lr packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null | xargs -r sudo rm -f
        sudo apt-get update && sudo apt-get install -y jq

        # Get hardware version from firmware
        HARDWARE_VERSION=$(grep '#define HARDWARE_VERSION' esp32/src/firmware_version.h | sed 's/.*"\(.*\)".*/\1/')
        echo "Hardware version: $HARDWARE_VERSION"

        # Get current date
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

        # Clone gh-pages branch to get existing registry
        git clone --depth=1 --branch=gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh_pages_temp

        # Create firmware directory structure
        mkdir -p gh_pages_temp/firmware/esp32

        # Initialize registry if it doesn't exist
        REGISTRY_FILE="gh_pages_temp/firmware/esp32/esp32_firmware_registry.json"
        if [ ! -f "$REGISTRY_FILE" ]; then
          echo "[]" > "$REGISTRY_FILE"
        fi

        VER="${{ needs.plan.outputs.version }}"
        # Publish one set of files per chip under <version>/<chip>/, add one registry entry
        # per chip (with a `chip` field so the app picks the matching architecture), and build
        # a single esp-web-tools manifest listing all chip families (the USB flasher
        # auto-detects and picks the right one). pio env | esptool --chip | chipFamily
        VARIANTS=(
          "esp32dev|esp32|ESP32"
          "esp32-s3|esp32s3|ESP32-S3"
          "esp32-c3|esp32c3|ESP32-C3"
        )
        BUILDS_JSON=""
        for row in "${VARIANTS[@]}"; do
          IFS='|' read -r ENV CHIP FAMILY <<< "$row"
          DEST="gh_pages_temp/firmware/esp32/$VER/$CHIP"
          mkdir -p "$DEST"
          cp "dist/firmware-$CHIP.bin"          "$DEST/firmware.bin"
          cp "dist/firmware-$CHIP.sig"          "$DEST/firmware.sig"
          cp "dist/firmware-$CHIP-nowifi.bin"   "$DEST/firmware-nowifi.bin"
          cp "dist/firmware-$CHIP-nowifi.sig"   "$DEST/firmware-nowifi.sig"
          cp "dist/chromabay-factory-$CHIP.bin" "$DEST/chromabay-factory.bin"

          WIFI_SIZE=$(stat -c%s "dist/firmware-$CHIP.bin")
          NOWIFI_SIZE=$(stat -c%s "dist/firmware-$CHIP-nowifi.bin")
          # Two entries per chip: WiFi (needs the larger partition) and no-WiFi (fits legacy
          # 1.375MB slots). The app compares `size` to the device's OTA slot to pick one.
          WIFI_ENTRY=$(jq -n \
            --arg ver "$VER" --arg chip "$CHIP" --arg hwver "$HARDWARE_VERSION" \
            --arg path "firmware/esp32/$VER/$CHIP/firmware.bin" \
            --arg sigpath "firmware/esp32/$VER/$CHIP/firmware.sig" \
            --arg date "$BUILD_DATE" --argjson size "$WIFI_SIZE" \
            '{version: $ver, chip: $chip, wifi: true, size: $size, hardwareVersion: $hwver, path: $path, signaturePath: $sigpath, date: $date}')
          NOWIFI_ENTRY=$(jq -n \
            --arg ver "$VER" --arg chip "$CHIP" --arg hwver "$HARDWARE_VERSION" \
            --arg path "firmware/esp32/$VER/$CHIP/firmware-nowifi.bin" \
            --arg sigpath "firmware/esp32/$VER/$CHIP/firmware-nowifi.sig" \
            --arg date "$BUILD_DATE" --argjson size "$NOWIFI_SIZE" \
            '{version: $ver, chip: $chip, wifi: false, size: $size, hardwareVersion: $hwver, path: $path, signaturePath: $sigpath, date: $date}')
          echo "New entries: $WIFI_ENTRY / $NOWIFI_ENTRY"
          # Prepend both, newest first.
          UPDATED_REGISTRY=$(jq --argjson w "$WIFI_ENTRY" --argjson n "$NOWIFI_ENTRY" '[$w, $n] + .' "$REGISTRY_FILE")
          echo "$UPDATED_REGISTRY" > "$REGISTRY_FILE"

          BUILDS_JSON="${BUILDS_JSON}{ \"chipFamily\": \"$FAMILY\", \"parts\": [ { \"path\": \"https://chromabay.app/firmware/esp32/$VER/$CHIP/chromabay-factory.bin\", \"offset\": 0 } ] },"
        done
        jq '.' "$REGISTRY_FILE" > "$REGISTRY_FILE.tmp" && mv "$REGISTRY_FILE.tmp" "$REGISTRY_FILE"
        BUILDS_JSON="${BUILDS_JSON%,}"   # strip trailing comma

        # esp-web-tools manifest — the SINGLE source the USB flasher reads (no committed .bin).
        # Absolute part URLs so the manifest location doesn't matter; the flasher matches the
        # connected chip against chipFamily and refuses a mismatch.
        cat > "gh_pages_temp/firmware/esp32/chromabay-manifest.json" <<MANIFEST
        {
          "name": "ChromaBay",
          "version": "$VER",
          "new_install_prompt_erase": true,
          "builds": [ $BUILDS_JSON ]
        }
        MANIFEST

        # Commit and push to gh-pages
        cd gh_pages_temp
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Deploy ESP32 firmware ${{ needs.plan.outputs.version }} and update registry (PSA-signed)"
        git push origin gh-pages

        # Clean up
        cd ..
        rm -rf gh_pages_temp

    # Register the release properly, rather than letting Sentry auto-create a stub when the
    # first event arrives. An auto-created release has no ship date and no commit range, so
    # every issue in it shows "unknown" for suspect commits — the one thing that turns a
    # crash into "this is the change that caused it". `--auto` uses the repo integration.
    - name: Register the release in Sentry
      if: env.SENTRY_AUTH_TOKEN != ''
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        RELEASE: ${{ needs.plan.outputs.version }}
      run: |
        set -euo pipefail
        curl -sL https://sentry.io/get-cli/ | INSTALL_DIR="$RUNNER_TEMP/sentry-cli" bash
        export PATH="$RUNNER_TEMP/sentry-cli:$PATH"
        # --ignore-missing: a commit sentry cannot resolve (a force-push, a rewritten
        # history) should not fail a firmware release that is otherwise fine.
        sentry-cli releases new "$RELEASE"
        sentry-cli releases set-commits --auto --ignore-missing "$RELEASE"
        sentry-cli releases finalize "$RELEASE"
        sentry-cli releases deploys "$RELEASE" new -e production
        echo "registered $RELEASE"

    - name: Clean up private key files
      if: always()
      run: |
        rm -f esp32-signing-private.pem
        rm -f private_key.raw
