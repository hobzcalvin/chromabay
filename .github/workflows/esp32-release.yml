name: ESP32 Firmware Release

on:
  push:
    tags:
      - 'fwv*'

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      actions: read    # Required to read workflow info
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      run: |
        pip install cryptography
    
    - name: Setup PlatformIO
      run: |
        pip install platformio
        pio --version
      
    - name: Create private key file from secret
      run: |
        echo "${{ secrets.ESP32_SIGNING_PRIVATE_KEY }}" > esp32-signing-private.pem
        chmod 600 esp32-signing-private.pem
        
    - name: Build firmware
      run: |
        cd esp32
        pio run
        
    - name: Sign firmware
      run: |
        python scripts/sign_firmware.py \
          esp32/.pio/build/esp32dev/firmware.bin \
          --private-key esp32-signing-private.pem \
          --output firmware.sig
          
    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
    - name: Create release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          esp32/.pio/build/esp32dev/firmware.bin
          firmware.sig
        body: |
          ## 🔵 ESP32 Firmware Release ${{ steps.version.outputs.VERSION }}
          
          ### 📦 Files:
          - **`firmware.bin`** - Main firmware binary for ESP32
          - **`firmware.sig`** - ECDSA P-256 signature for secure OTA updates
          
          ### 🔐 Security Features:
          - ✅ Firmware is cryptographically signed with ECDSA P-256
          - ✅ Signature verification enforced on device during OTA
          - ✅ Tamper-proof updates prevent malicious firmware installation
          
          ### 📋 Installation:
          **Initial Upload (USB):**
          ```bash
          # Download firmware.bin and flash via USB
          esptool.py --port /dev/ttyUSB0 write_flash 0x10000 firmware.bin
          ```
          
          **OTA Update (BLE):**
          1. Connect to device via BLE (Service UUID: `a0be83e4-8dc9-47f0-ab40-b19721d20ed1`)
          2. Send signature to characteristic `a0be83eb-8dc9-47f0-ab40-b19721d20ed1`
          3. Send firmware data to characteristic `a0be83e9-8dc9-47f0-ab40-b19721d20ed1`
          4. Send "END_OTA" to characteristic `a0be83e8-8dc9-47f0-ab40-b19721d20ed1`
          5. Device verifies signature and reboots with new firmware
          
          ### 🛠 Technical Details:
          - **Target:** ESP32 with 4MB flash
          - **Framework:** Arduino with PlatformIO
          - **Partition Scheme:** Dual OTA (app0/app1) with LittleFS
          - **BLE Stack:** NimBLE for efficient memory usage
          - **LED Support:** WS2812B via NeoPixelBus + FastLED
          
        draft: false
        prerelease: false

    - name: Update firmware registry on GitHub Pages
      run: |
        # Install jq for JSON manipulation
        sudo apt-get update && sudo apt-get install -y jq
        
        # Get hardware version from firmware
        HARDWARE_VERSION=$(grep '#define HARDWARE_VERSION' esp32/src/firmware_version.h | sed 's/.*"\(.*\)".*/\1/')
        echo "Hardware version: $HARDWARE_VERSION"
        
        # Get current date
        BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        
        # Clone gh-pages branch to get existing registry
        git clone --depth=1 --branch=gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh_pages_temp
        
        # Create firmware directory structure
        mkdir -p gh_pages_temp/firmware/esp32
        
        # Initialize registry if it doesn't exist
        REGISTRY_FILE="gh_pages_temp/firmware/esp32/esp32_firmware_registry.json"
        if [ ! -f "$REGISTRY_FILE" ]; then
          echo "[]" > "$REGISTRY_FILE"
        fi
        
        # Create new registry entry with new format
        NEW_ENTRY=$(jq -n \
          --arg ver "${{ steps.version.outputs.VERSION }}" \
          --arg hwver "$HARDWARE_VERSION" \
          --arg path "firmware/esp32/${{ steps.version.outputs.VERSION }}/firmware.bin" \
          --arg sigpath "firmware/esp32/${{ steps.version.outputs.VERSION }}/firmware.sig" \
          --arg date "$BUILD_DATE" \
          '{version: $ver, hardwareVersion: $hwver, path: $path, signaturePath: $sigpath, date: $date}')
        
        echo "New registry entry: $NEW_ENTRY"
        
        # Add new entry to registry (prepend to keep newest first)
        UPDATED_REGISTRY=$(cat "$REGISTRY_FILE" | jq --argjson new_entry "$NEW_ENTRY" '[$new_entry] + .')
        echo "$UPDATED_REGISTRY" | jq '.' > "$REGISTRY_FILE"
        
        # Create firmware files directory and copy files
        mkdir -p "gh_pages_temp/firmware/esp32/${{ steps.version.outputs.VERSION }}"
        cp esp32/.pio/build/esp32dev/firmware.bin "gh_pages_temp/firmware/esp32/${{ steps.version.outputs.VERSION }}/"
        cp firmware.sig "gh_pages_temp/firmware/esp32/${{ steps.version.outputs.VERSION }}/"
        
        # Commit and push to gh-pages
        cd gh_pages_temp
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add .
        git commit -m "Deploy ESP32 firmware ${{ steps.version.outputs.VERSION }} and update registry"
        git push origin gh-pages
        
        # Clean up
        cd ..
        rm -rf gh_pages_temp
        
    - name: Clean up private key
      if: always()
      run: |
        rm -f esp32-signing-private.pem
