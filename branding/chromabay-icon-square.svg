<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="ChromaBay">
  <defs>
    <!-- Dark sky → faint bay water at the bottom -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#0A1026"/>
      <stop offset="0.55" stop-color="#070D1C"/>
      <stop offset="1"    stop-color="#0A2236"/>
    </linearGradient>
    <radialGradient id="water" cx="50%" cy="96%" r="55%">
      <stop offset="0"   stop-color="#16557F" stop-opacity="0.55"/>
      <stop offset="1"   stop-color="#16557F" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="11" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Edge gradients (center→center), blending endpoint hues -->
    <linearGradient id="eTrunk" gradientUnits="userSpaceOnUse" x1="512" y1="888" x2="512" y2="680"><stop offset="0" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF2D55"/></linearGradient>
    <linearGradient id="eT1L" gradientUnits="userSpaceOnUse" x1="512" y1="680" x2="360" y2="540"><stop offset="0" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF9F45"/></linearGradient>
    <linearGradient id="eT1R" gradientUnits="userSpaceOnUse" x1="512" y1="680" x2="664" y2="540"><stop offset="0" stop-color="#FF2D55"/><stop offset="1" stop-color="#FF4FA3"/></linearGradient>
    <linearGradient id="eLy" gradientUnits="userSpaceOnUse" x1="360" y1="540" x2="430" y2="250"><stop offset="0" stop-color="#FF9F45"/><stop offset="1" stop-color="#FFD23F"/></linearGradient>
    <linearGradient id="eLl" gradientUnits="userSpaceOnUse" x1="360" y1="540" x2="288" y2="300"><stop offset="0" stop-color="#FF9F45"/><stop offset="1" stop-color="#6BDB4A"/></linearGradient>
    <linearGradient id="eLg" gradientUnits="userSpaceOnUse" x1="360" y1="540" x2="190" y2="410"><stop offset="0" stop-color="#FF9F45"/><stop offset="1" stop-color="#3FE08A"/></linearGradient>
    <linearGradient id="eRv" gradientUnits="userSpaceOnUse" x1="664" y1="540" x2="594" y2="250"><stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#A56BFF"/></linearGradient>
    <linearGradient id="eRb" gradientUnits="userSpaceOnUse" x1="664" y1="540" x2="736" y2="300"><stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#4C7BFF"/></linearGradient>
    <linearGradient id="eRc" gradientUnits="userSpaceOnUse" x1="664" y1="540" x2="834" y2="410"><stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#34C8FF"/></linearGradient>

    <!-- Node fills: bright center → saturated rim -->
    <radialGradient id="nRed"     cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#FF8FA6"/><stop offset="1" stop-color="#FF2D55"/></radialGradient>
    <radialGradient id="nOrange"  cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#FFD0A0"/><stop offset="1" stop-color="#FF9F45"/></radialGradient>
    <radialGradient id="nYellow"  cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#FFEFA8"/><stop offset="1" stop-color="#FFD23F"/></radialGradient>
    <radialGradient id="nLime"    cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#C7F2A8"/><stop offset="1" stop-color="#6BDB4A"/></radialGradient>
    <radialGradient id="nGreen"   cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#A8F5CD"/><stop offset="1" stop-color="#3FE08A"/></radialGradient>
    <radialGradient id="nMagenta" cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#FFAFD4"/><stop offset="1" stop-color="#FF4FA3"/></radialGradient>
    <radialGradient id="nViolet"  cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#DCC3FF"/><stop offset="1" stop-color="#A56BFF"/></radialGradient>
    <radialGradient id="nBlue"    cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#AEC4FF"/><stop offset="1" stop-color="#4C7BFF"/></radialGradient>
    <radialGradient id="nCyan"    cx="36%" cy="32%" r="82%"><stop offset="0" stop-color="#AEE9FF"/><stop offset="1" stop-color="#34C8FF"/></radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="0" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="0" fill="url(#water)"/>

  <!-- Branches -->
  <g filter="url(#glow)" stroke-linecap="round" opacity="0.95">
    <line x1="512" y1="888" x2="512" y2="680" stroke="url(#eTrunk)" stroke-width="22"/>
    <line x1="512" y1="680" x2="360" y2="540" stroke="url(#eT1L)" stroke-width="18"/>
    <line x1="512" y1="680" x2="664" y2="540" stroke="url(#eT1R)" stroke-width="18"/>
    <line x1="360" y1="540" x2="430" y2="250" stroke="url(#eLy)" stroke-width="15"/>
    <line x1="360" y1="540" x2="288" y2="300" stroke="url(#eLl)" stroke-width="15"/>
    <line x1="360" y1="540" x2="190" y2="410" stroke="url(#eLg)" stroke-width="15"/>
    <line x1="664" y1="540" x2="594" y2="250" stroke="url(#eRv)" stroke-width="15"/>
    <line x1="664" y1="540" x2="736" y2="300" stroke="url(#eRb)" stroke-width="15"/>
    <line x1="664" y1="540" x2="834" y2="410" stroke="url(#eRc)" stroke-width="15"/>
  </g>

  <!-- Nodes (rounded squares) -->
  <g filter="url(#glow)">
    <!-- trunk (stacked, red) -->
    <rect x="466" y="842" width="92" height="92" rx="24" fill="url(#nRed)"/>
    <rect x="466" y="634" width="92" height="92" rx="24" fill="url(#nRed)"/>
    <!-- split tier -->
    <rect x="314" y="494" width="92" height="92" rx="24" fill="url(#nOrange)"/>
    <rect x="618" y="494" width="92" height="92" rx="24" fill="url(#nMagenta)"/>
    <!-- canopy: warm up the left -->
    <rect x="384" y="204" width="92" height="92" rx="24" fill="url(#nYellow)"/>
    <rect x="242" y="254" width="92" height="92" rx="24" fill="url(#nLime)"/>
    <rect x="144" y="364" width="92" height="92" rx="24" fill="url(#nGreen)"/>
    <!-- canopy: cool up the right -->
    <rect x="548" y="204" width="92" height="92" rx="24" fill="url(#nViolet)"/>
    <rect x="690" y="254" width="92" height="92" rx="24" fill="url(#nBlue)"/>
    <rect x="788" y="364" width="92" height="92" rx="24" fill="url(#nCyan)"/>
  </g>
</svg>
