		<!-- FastLED WASM Operator System -->
		<script>
			// Global WASM module initialization
			let wasmModule = null;
			let wasmReady = false;
			const WASM_ASSETS = '/native/';

			function loadScript(src) {
				return new Promise((resolve, reject) => {
					const s = document.createElement('script');
					s.src = src;
					s.onload = resolve;
					s.onerror = () => reject(new Error('failed to load ' + src));
					document.head.appendChild(s);
				});
			}

			// Initialize WASM when page loads
			window.addEventListener('load', async () => {
				console.log('🚀 Starting WASM initialization...');
				try {
					// Content version stamped by native/build-wasm.sh. We fetch this tiny
					// file fresh every load (Date.now bust) and use it as a ?v= query on the
					// big .js/.wasm, so a rebuilt module is never served stale from the HTTP
					// cache — yet only re-downloads when its content actually changed.
					let q = '';
					try {
						await loadScript(WASM_ASSETS + 'wasm-version.js?t=' + Date.now());
						if (window.__WASM_VERSION) q = '?v=' + window.__WASM_VERSION;
					} catch (e) {
						console.warn('wasm-version.js missing; loading without cache-bust', e);
					}

					await loadScript(WASM_ASSETS + 'fastled.js' + q);
					if (typeof fastled === 'undefined') {
						throw new Error('fastled function not found - WASM script may have failed to load');
					}

					console.log('✅ fastled function found, calling it...');
					wasmModule = await fastled({
						// Pin asset resolution to where fastled.js actually lives
						// (…/native/). Without this, Emscripten guesses the .wasm
						// path relative to the document, which 404s under a base
						// path (e.g. GitHub Pages at /chromabay/<route>). Carries the
						// same ?v= cache-buster as the script load.
						locateFile: function(path) {
							return WASM_ASSETS + path + q;
						},
						// Capture WASM stdout/stderr
						print: function(text) {
							console.log('[WASM stdout]:', text);
						},
						printErr: function(text) {
							console.error('[WASM stderr]:', text);
						}
					});
					wasmReady = true;
					console.log('✅ FastLED WASM module loaded successfully' + (q ? ' (v' + window.__WASM_VERSION + ')' : ''));

					// Test operator count
					try {
						const operatorCount = wasmModule.ccall('getOperatorCount', 'number', [], []);
						console.log('🎯 WASM Operator count:', operatorCount);
					} catch (testError) {
						console.error('❌ WASM operator count test failed:', testError);
					}

					// Dispatch custom event to notify app components
					window.dispatchEvent(new CustomEvent('wasmReady', { detail: { module: wasmModule } }));
				} catch (error) {
					console.error('❌ Failed to load FastLED WASM module:', error);
					console.error('❌ Error type:', error.constructor.name);
					console.error('❌ Current URL:', window.location.href);
					console.error('❌ Base path:', document.getElementsByTagName('base')[0]?.href || 'none');
				}
			});

			// Global helper functions for WASM interaction
			window.getWasmModule = () => wasmModule;
			window.isWasmReady = () => wasmReady;
		</script>
