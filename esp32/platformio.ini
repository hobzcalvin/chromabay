; PlatformIO Project Configuration File
;
; ChromaBay firmware builds for every BLE-capable ESP32 variant WLED-class hardware ships
; on. Each [env] below is one chip family; they share everything in the [env] base section
; and only override board + chip-specific bits (USB mode, default LED pin, upload speed).
;
;   pio run                      -> builds ALL envs
;   pio run -e esp32dev          -> classic ESP32 (WROOM/WROVER, PICO-D4, M5 Atom Lite)
;   pio run -e esp32-s3          -> ESP32-S3 (M5 AtomS3 / AtomS3-Lite, S3 devkits)
;   pio run -e esp32-c3          -> ESP32-C3 (Seeed XIAO ESP32-C3, C3 super-mini)
;
; NOTE: ESP32-S2 and ESP8266 are intentionally absent — they have no Bluetooth LE, and
; ChromaBay is BLE-first, so it can't run on them even though WLED does.

[env]
; Pin the platform (arduino-esp32 core) exactly, like lib_deps below. An unpinned
; platform floats to the latest core on every CI build, which can change the LittleFS
; implementation; if a new core can't mount a filesystem an older build wrote, the
; device reformats on boot and SILENTLY LOSES saved patterns across an OTA/flash.
; Pinned to the version current builds already use, so the filesystem format stays
; stable and persisted patterns survive updates.
platform = espressif32@7.0.1
framework = arduino

; Stamp a unique git+timestamp version into local dev builds (no-op in CI).
; sentry_build_env.py hands the SDK the build-id and load address of the image being
; linked, from the SENTRY_MICRO_* variables the release chain exports. Injects nothing
; (and costs nothing) on a normal build.
extra_scripts =
    pre:scripts/version_stamp.py
    pre:scripts/sentry_build_env.py

monitor_speed = 115200

; Libraries
; Versions are pinned exactly for a reproducible firmware build. FastLED in
; particular must stay pinned: 3.10.x ships new internal `fl/` headers that fail
; to compile against this ESP32 Arduino core (e.g. `CRGB = fl::CHSV` in
; fl/fill.h), so the previous unpinned `^3.7.7` silently broke the build by
; floating up to 3.10.x.
lib_deps =
    fastled/FastLED@3.7.7
    h2zero/NimBLE-Arduino@1.4.3
    makuna/NeoPixelBus@2.8.4      ; LED output driver
    ; sentry-micro — crash/reset-reason reporting. https://github.com/getsentry/sentry-micro
    ;
    ; Comes from the environment rather than being written here, because this is the one
    ; dependency that gets developed alongside the firmware. Point it at a checkout while
    ; working on the SDK — in your shell profile:
    ;   export CHROMABAY_SENTRY_MICRO=symlink://$HOME/code/sentry-micro
    ; It cannot be both a pin and an override: two entries naming the same library resolve
    ; to two copies of it and the link fails on duplicate symbols.
    ;
    ; CI exports the pinned commit instead — see .github/workflows/esp32-release.yml, which
    ; pins the SDK and the debug-file upload action to the same revision, so the firmware
    ; and the tooling that describes it can never drift apart. Unset, this expands to
    ; nothing: src/sentry_reporting.h detects the header with __has_include and compiles to
    ; no-ops, so a checkout without the SDK still builds — just without crash reporting.
    ${sysenv.CHROMABAY_SENTRY_MICRO}

; Build flags shared by every chip: BLE-only (NimBLE), minimal WiFi, LittleFS tuning.
; Per-chip flags (arch, USB mode, default LED pin) are appended in each env below.
build_flags =
    ; Lower core debug level: smaller binary (fewer OTA chunks) + less per-write logging.
    -D CORE_DEBUG_LEVEL=1
    ; OTA Rollback Configuration
    -D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
    ; NimBLE Configuration (more efficient than Bluedroid)
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BLUEDROID_ENABLED=0
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CONFIG_CLASSIC_BT_ENABLED=0
    -D CONFIG_BLE_MESH_ENABLED=0
    ; WiFi Minimization (keep WiFi available but minimize usage)
    -D CONFIG_WIFI_LWIP_ALLOCATION_FROM_SPIRAM_FIRST=0
    ; LittleFS Optimization
    -D CONFIG_LITTLEFS_FOR_IDFV3_3=1
    -D CONFIG_LITTLEFS_HUMAN_READABLE=1
    ; Sentry DSN, from the environment rather than a file so it never lands in git. Empty
    ; unless CHROMABAY_SENTRY_DSN is exported, in which case the SDK stays disabled and every
    ; call in sentry_reporting.h no-ops. See src/sentry_reporting.h.
    -D CHROMABAY_SENTRY_DSN=\"${sysenv.CHROMABAY_SENTRY_DSN}\"
    ; NOTE: do NOT add -Wl,--build-id here. Symbolication does need a GNU build-id in the ELF,
    ; but the linker marks that note ALLOC and places it at the start of IRAM, pushing
    ; .iram0.vectors off 0x40080000. VECBASE needs 1KB alignment, so the first interrupt jumps
    ; into the note and the board boot-loops with rst:0x10 (RTCWDT_RTC_RESET) — measured on a
    ; PICO-D4, not theorised. Stamp the note in after linking as a non-ALLOC section instead;
    ; sentry-micro's scripts/stamp_build_id.py does exactly that and explains why.

; Partition table (fixed LittleFS SubType 0x82). Default is the 4MB layout: 1.75MB dual-OTA
; app slots (WiFi/growth headroom) + 64KB ELF coredump + 384KB LittleFS. 8MB chips override
; board_build.partitions/flash_size in their env (see esp32-s3) to claim the upper flash.
board_build.partitions = partitions-4mb.csv
board_build.filesystem = littlefs
board_build.flash_size = 4MB
board_build.flash_mode = dio

; OTA configuration (minimal WiFi usage)
upload_protocol = esptool
; For OTA later: upload_protocol = espota

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup


; ── Classic ESP32 (Xtensa LX6) ──────────────────────────────────────────────
; WROOM/WROVER modules, ESP32-PICO-D4, M5 Atom Lite/Matrix, most WLED controllers.
[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ARDUINO_ARCH_ESP32
    -D CHROMABAY_DEFAULT_LED_PIN=13
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
upload_speed = 115200


; ── ESP32-S3 (Xtensa LX7, native USB) ───────────────────────────────────────
; M5 AtomS3 / AtomS3-Lite (onboard WS2812 on GPIO35), generic S3 devkits.
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_ARCH_ESP32
    ; Native USB serial on boot so USB flashing / serial monitor work without a UART bridge.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CHROMABAY_DEFAULT_LED_PIN=35
; AtomS3 boards are N8 (8MB) — use the 8MB table (2MB app slots + ~3.9MB LittleFS).
board_build.partitions = partitions-8mb.csv
board_build.flash_size = 8MB
upload_speed = 921600


; ── ESP32-C3 (RISC-V, USB Serial/JTAG) ──────────────────────────────────────
; Seeed XIAO ESP32-C3, ESP32-C3 super-mini. Fewer RMT channels than classic ESP32.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -D ARDUINO_ARCH_ESP32
    ; The C3's only USB is the built-in Serial/JTAG (HWCDC), so USB_MODE=1 is required —
    ; without it `Serial` maps to the USB-OTG CDC the C3 doesn't have and won't compile.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CHROMABAY_DEFAULT_LED_PIN=2
upload_speed = 921600


; ── No-WiFi variants ────────────────────────────────────────────────────────
; Same firmware with the WiFi/TCP transport + Art-Net/sACN compiled out (CHROMABAY_WIFI=0).
; The image is ~900KB (vs ~1.38MB), small enough to OTA onto legacy 1.375MB-slot devices that
; can't fit the WiFi build and can't repartition over the air. USB-flash the WiFi build for
; new devices; the app offers the no-WiFi build only where the WiFi one won't fit.
[env:esp32dev-nowifi]
extends = env:esp32dev
build_flags = ${env:esp32dev.build_flags} -D CHROMABAY_WIFI=0

[env:esp32-s3-nowifi]
extends = env:esp32-s3
build_flags = ${env:esp32-s3.build_flags} -D CHROMABAY_WIFI=0

[env:esp32-c3-nowifi]
extends = env:esp32-c3
build_flags = ${env:esp32-c3.build_flags} -D CHROMABAY_WIFI=0
