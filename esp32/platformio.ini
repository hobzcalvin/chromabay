; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial configuration
monitor_speed = 115200
upload_speed = 115200

; Libraries
lib_deps = 
    ../src/native/FastLED         ; Use the FastLED submodule
    h2zero/NimBLE-Arduino@^1.4.2
    makuna/NeoPixelBus            ; LED output driver


; Build flags with BLE support and WiFi minimization
build_flags = 
    -D ARDUINO_ARCH_ESP32
    -D CORE_DEBUG_LEVEL=3
    ; OTA Rollback Configuration
    -D CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
    ; NimBLE Configuration (more efficient than Bluedroid)
    -D CONFIG_BT_ENABLED=1
    -D CONFIG_BLUEDROID_ENABLED=0
    -D CONFIG_BT_NIMBLE_ENABLED=1
    -D CONFIG_CLASSIC_BT_ENABLED=0
    -D CONFIG_BLE_MESH_ENABLED=0
    ; WiFi Minimization (keep WiFi available but minimize usage)
    -D CONFIG_WIFI_LWIP_ALLOCATION_FROM_SPIRAM_FIRST=0
    ; LittleFS Optimization
    -D CONFIG_LITTLEFS_FOR_IDFV3_3=1
    -D CONFIG_LITTLEFS_HUMAN_READABLE=1

; Custom partition table with fixed LittleFS SubType
board_build.partitions = partitions.csv

; Filesystem configuration  
board_build.filesystem = littlefs

; Memory configuration for 4MB flash
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_size = 4MB

; OTA configuration (minimal WiFi usage)
upload_protocol = esptool
; For OTA later: upload_protocol = espota
; upload_port = esp32.local

; Debug configuration
debug_tool = esp-prog
debug_init_break = tbreak setup
